<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="324" viewBox="0 0 1200 324" role="img">
<defs><linearGradient id="blue" x2="0" y2="1"><stop stop-color="#3b9bff"/><stop offset="1" stop-color="#1763d7"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#7d99bf" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif;fill:#e6edf3}.muted{fill:#9aa9bd}.blue{fill:#79b8ff}.title{font-size:28px;font-weight:650}.label{font-size:19px;font-weight:600}.small{font-size:16px}.number{font-size:32px;font-weight:650}</style>
<rect x="1" y="1" width="1198" height="322" rx="22" fill="#101722" stroke="#303c4f"/><text x="40" y="49" class="title" text-anchor="start">高清如何适配每一块屏幕</text><rect x="40" y="81" width="340" height="151" rx="16" fill="#1c293c" stroke="#3a5271"/><text x="60" y="116" class="label" text-anchor="start">识别原生屏幕</text><text x="60" y="166" class="number blue" text-anchor="start">2388 × 1668</text><text x="60" y="205" class="small muted" text-anchor="start">系统报告的面板像素</text><rect x="430" y="81" width="340" height="151" rx="16" fill="#1c293c" stroke="#3a5271"/><text x="450" y="116" class="label" text-anchor="start">选择桌面与高清渲染</text><text x="450" y="166" class="number blue" text-anchor="start">1344 × 938</text><text x="450" y="205" class="small muted" text-anchor="start">2688 × 1876 渲染像素</text><rect x="820" y="81" width="340" height="151" rx="16" fill="#1c293c" stroke="#3a5271"/><text x="840" y="116" class="label" text-anchor="start">由随航显示到 iPad</text><text x="840" y="166" class="number blue" text-anchor="start">2388 × 1668</text><text x="840" y="205" class="small muted" text-anchor="start">按屏幕缩放呈现</text><path d="M390 157h29" stroke="#7d99bf" stroke-width="2" marker-end="url(#arrow)"/><path d="M780 157h29" stroke="#7d99bf" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="272" class="small muted" text-anchor="start">示例来自已测的 11 英寸 iPad Pro；其他面板按原生像素和比例生成档位。</text><text x="40" y="300" class="small muted" text-anchor="start">显示清晰度与桌面空间可选；刷新率、HDR 和编码由系统随航决定。</text></svg>